name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run API and catalog tests
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m compileall -q backend/app tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/api.js

      - name: Test frontend behavior and API client
        run: node --test tests/frontend/*.test.mjs

      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.prod.yaml config --quiet

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag digital-sommelier-frontend:ci .

      - name: Start frontend image
        run: |
          # Nginx resolves the Compose service name at startup. The frontend
          # healthcheck itself is static, so CI supplies an inert hostname.
          docker run --detach --name digital-sommelier-frontend-ci --add-host backend:127.0.0.1 --publish 8080:80 digital-sommelier-frontend:ci

      - name: Wait for frontend healthcheck
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs digital-sommelier-frontend-ci
          exit 1

      - name: Stop frontend image
        if: always()
        run: docker rm --force digital-sommelier-frontend-ci || true
