name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run API and catalog tests
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m compileall -q backend/app tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/api.js

      - name: Test frontend behavior and API client
        run: node --test tests/frontend/*.test.mjs

      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.prod.yaml config --quiet

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag digital-sommelier-frontend:ci .

      - name: Start and check frontend image
        run: |
          docker run --detach --rm --name digital-sommelier-frontend-ci --publish 8080:80 digital-sommelier-frontend:ci
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8080/health
          docker stop digital-sommelier-frontend-ci
