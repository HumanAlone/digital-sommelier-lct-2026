upstream wine_backend {
    server backend:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The frontend keeps the catalog locally. This endpoint exposes the same
    # JSON when WINE_API_BASE=/api, matching api.js without duplicating data.
    location = /api/wines {
        try_files /catalog.json =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # Relative image paths in catalog.json are resolved against /api/ by the
    # API client. Serve the same static assets at that prefix.
    location /api/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Compatibility adapter: frontend calls /api/scan, backend owns /predict.
    location = /api/scan {
        proxy_pass http://wine_backend/predict;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }

    location = /api/health {
        proxy_pass http://wine_backend/health;
        proxy_http_version 1.1;
    }

    # Return a predictable API error for endpoints the current backend does
    # not provide yet (authentication, collections, diary and so on).
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"API endpoint is not implemented"}';
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
